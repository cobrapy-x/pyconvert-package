name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: ruff check
        run: ruff check .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The library is pure Python with no dependencies, so one version is
        # enough to confirm it behaves the same on macOS and Windows.
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite and the docstring examples
        run: python -m pytest -q

      - name: Confirm the package imports from a clean interpreter
        run: |
          python -c "import pyconvert; print(pyconvert.__version__)"
          python -c "import pyconvert; assert pyconvert.convert(100, 'celsius', 'fahrenheit') == 212.0"

      - name: Run the example scripts
        run: |
          python examples/basic_conversions.py
          python examples/number_systems.py

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate the metadata and the rendered README
        run: python -m twine check --strict dist/*

      - name: Install the built wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd "${{ runner.temp }}"
          python -c "import pyconvert; print(pyconvert.__version__)"
          python -c "import pyconvert; assert pyconvert.convert_base(1000, 10, 36) == 'RS'"

      - name: Upload the distribution for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
